name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automerge:
    runs-on: ubuntu-latest

    steps:
      - name: Check pull request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for i in {1..5}; do
            PR=$(gh api \
              "/repos/${{ github.repository }}/pulls/$PR_NUMBER")

            AUTHOR=$(echo "$PR" | jq -r '.user.login')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')
            MERGEABLE_STATE=$(echo "$PR" | jq -r '.mergeable_state')

            if [ "$MERGEABLE" != "null" ] && [ "$MERGEABLE_STATE" != "unknown" ]; then
              break
            fi
            echo "Waiting for mergeable state calculation... ($i/5)"
            sleep 2
          done

          echo "Author: $AUTHOR"
          echo "Mergeable: $MERGEABLE"
          echo "Mergeable state: $MERGEABLE_STATE"

          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "mergeable=$MERGEABLE" >> "$GITHUB_OUTPUT"
          echo "mergeable_state=$MERGEABLE_STATE" >> "$GITHUB_OUTPUT"

          RECREATE_COUNT=$(gh api \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("@dependabot recreate"))] | length')

          echo "Recreate count: $RECREATE_COUNT"
          echo "recreate_count=$RECREATE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Comment on non-Dependabot pull request
        if: steps.check.outputs.author != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body='This pull request will not be automatically merged because it was not opened by Dependabot.'

      - name: Request recreate on merge conflict
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          (
            steps.check.outputs.mergeable == 'false' ||
            steps.check.outputs.mergeable_state == 'dirty'
          ) &&
          steps.check.outputs.recreate_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body='@dependabot recreate'

      - name: Comment on merge conflict
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          (
            steps.check.outputs.mergeable == 'false' ||
            steps.check.outputs.mergeable_state == 'dirty'
          ) &&
          steps.check.outputs.recreate_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body='This Dependabot pull request has merge conflicts and cannot be automatically merged. Please resolve the conflicts manually.'

      - name: Approve Dependabot pull request
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          steps.check.outputs.mergeable != 'false' &&
          steps.check.outputs.mergeable_state != 'dirty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --approve \
            --body 'Automatically approved because this pull request was opened by Dependabot.' || gh api \
            --method POST \
            "/repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            -f event='APPROVE' \
            -f body='Automatically approved because this pull request was opened by Dependabot.'

      - name: Merge or enable auto-merge for Dependabot pull request
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          steps.check.outputs.mergeable != 'false' &&
          steps.check.outputs.mergeable_state != 'dirty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Processing merge for Dependabot PR #$PR_NUMBER..."

          # Try enabling GitHub native auto-merge first
          if gh pr merge "$PR_NUMBER" --auto --merge; then
            echo "Auto-merge enabled successfully for PR #$PR_NUMBER."
          else
            echo "Auto-merge could not be enabled directly (e.g. unstable status or direct merge available). Falling back to direct merge workflow..."

            # If CI checks exist, wait for them to finish
            if gh pr checks "$PR_NUMBER" >/dev/null 2>&1; then
              echo "Waiting for CI checks to complete..."
              if ! gh pr checks "$PR_NUMBER" --watch --fail-fast; then
                echo "CI checks failed or were cancelled. Aborting merge."
                exit 1
              fi
            fi

            echo "Executing direct merge for PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --merge
          fi